<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Application de saisie</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f5f5f5}
h1{color:#1F4E79}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#1F4E79;color:#fff}
a.btn{display:inline-block;padding:8px 14px;background:#1F4E79;color:#fff;text-decoration:none;border-radius:4px;margin:5px 0}
form{background:#fff;padding:20px;border-radius:6px;max-width:600px}
label{display:block;margin:10px 0 4px;font-weight:bold}
input{width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
button{padding:10px 20px;background:#1F4E79;color:#fff;border:none;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<h1>Enregistrements</h1>
<a class="btn" href="/add">Nouveau enregistrement</a>
<a class="btn" href="/export">Exporter en Excel</a>
<table>
<tr>{% for c in columns %}<th>{{c}}</th>{% endfor %}</tr>
{% for r in rows %}
<tr>{% for c in columns %}<td>{{r[c]}}</td>{% endfor %}</tr>
{% endfor %}
</table>
<script>document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'))||(e.ctrlKey&&e.key==='U'))e.preventDefault();});</script></body>
</html>
